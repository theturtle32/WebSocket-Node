codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 85%
        threshold: 1%
        if_ci_failed: error

    patch:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: yes
  require_base: no
  require_head: yes

ignore:
  - "test/**"
  - "examples/**"
  - "bench/**"
  - "docs/**"
  - "scripts/**"
  - "lib/version.js"
  - "**/*.test.mjs"
  - "**/*.test.js"
  - "**/*.bench.mjs"
